# Root-owned /etc/ssh/sshd_config.d/90-sorvo-deploy.conf
# Confirm the main sshd_config includes this directory; validate with sshd -t.
Match User sorvo-deploy
    AuthorizedKeysFile /etc/ssh/sorvo-deploy.keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    ForceCommand /usr/local/lib/sorvo-ssh-deploy.py
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
Match all
