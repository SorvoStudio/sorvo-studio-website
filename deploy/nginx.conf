# Production site configuration. Requires the existing Let's Encrypt certificate.
# Install as /etc/nginx/sites-available/sorvo-studio-website and enable it
# with a symlink in sites-enabled. Validate with nginx -t before reloading.
server {
    listen 80;
    listen [::]:80;
    server_name sorvostudio.com www.sorvostudio.com;
    root /var/www/sorvo-studio-website/public;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sorvo-acme; }
    location = /app-ads.txt { default_type text/plain; try_files $uri =404; }
    location / { return 301 https://www.sorvostudio.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sorvostudio.com;
    ssl_certificate /etc/letsencrypt/live/sorvo-studio-website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorvo-studio-website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/sorvo-studio-website/public;
    location = /app-ads.txt { default_type text/plain; try_files $uri =404; }
    location / { return 301 https://www.sorvostudio.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sorvostudio.com;
    ssl_certificate /etc/letsencrypt/live/sorvo-studio-website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorvo-studio-website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/sorvo-studio-website/public;
    index index.html;
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ /\. { deny all; }
}
